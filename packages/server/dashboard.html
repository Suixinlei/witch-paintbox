<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魔女画匣 · 服务管理</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script type="module" src="/dashboard.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <p class="eyebrow">魔女画匣 · 独立服务</p>
        <h1>服务管理</h1>
      </div>
      <div class="masthead-actions">
        <button type="button" id="refresh" class="secondary" hidden>刷新状态</button>
        <button type="button" id="logout" class="secondary" hidden>退出</button>
      </div>
    </header>
    <form id="auth" class="panel">
      <label for="token">服务管理员令牌</label>
      <div class="actions auth-row">
        <input id="token" type="password" autocomplete="off" required>
        <button>进入管理</button>
      </div>
    </form>
    <p role="status" id="error" class="status"></p>
    <div id="dashboard" hidden>
      <dl class="facts" id="live-service" aria-label="实时服务状态">
        <div class="fact"><dt>服务接收状态</dt><dd id="live-connection">正在连接…</dd></div>
        <div class="fact"><dt>Prompt 处理队列</dt><dd id="live-prompt">—</dd></div>
        <div class="fact"><dt>绘图队列</dt><dd id="live-draw">—</dd></div>
      </dl>
      <p id="live-check" class="muted live-check"></p>
      <div class="dashboard-workspace">
        <nav class="page-nav" aria-label="管理台页面">
          <a href="#overview" data-dashboard-page="overview">服务概览</a>
          <div class="page-nav-group">
            <p>全局配置</p>
            <a href="#image" data-dashboard-page="image" data-editor>生图 API 与参数</a>
            <a href="#artists" data-dashboard-page="artists" data-editor>画师词与试绘</a>
            <a href="#model" data-dashboard-page="model" data-editor>模型连接</a>
            <a href="#prompts" data-dashboard-page="prompts" data-editor>正文处理 Prompt</a>
            <a href="#workflow" data-dashboard-page="workflow" data-editor>配图工作流</a>
            <a href="#preferences" data-dashboard-page="preferences" data-editor>偏好与配置文件</a>
          </div>
          <div class="page-nav-group">
            <p>共享资料</p>
            <a href="#worldbooks" data-dashboard-page="worldbooks" data-editor>世界书</a>
            <a href="#anchors" data-dashboard-page="anchors" data-editor>四方角色锚点</a>
            <a href="#outfits" data-dashboard-page="outfits" data-editor>通用服装</a>
          </div>
          <div class="page-nav-group">
            <p>角色卡与记录</p>
            <a href="#cards" data-dashboard-page="cards">Risu 角色卡</a>
            <a href="#history" data-dashboard-page="history">生图历史</a>
          </div>
        </nav>
        <label class="page-picker">切换页面<select id="page-picker"></select></label>
        <div class="page-content">
          <h2 id="page-heading" tabindex="-1">服务概览</h2>
          <section id="overview" aria-labelledby="page-heading">
            <dl class="facts" id="facts"></dl>
            <div class="panel storage">
              <h3>本机存储与服务状态</h3>
              <dl id="storage"></dl>
            </div>
          </section>
          <section id="global" aria-labelledby="page-heading" hidden>
            <section class="panel" id="risu-workflow" hidden>
              <h3>Risu 全局自动配图</h3>
              <form id="risu-preferences">
                <fieldset disabled>
                  <label class="check"><input type="checkbox" name="enabled"> 回复完成后自动配图</label>
                  <label class="check"><input type="checkbox" name="dynamicSize"> 动态画幅</label>
                  <label>每楼最多张数<input type="number" name="maxIllustrations" min="1" max="6" required></label>
                  <label>输入字符上限<input type="number" name="maxInputChars" min="1000" max="262144" required></label>
                  <button>保存 Risu 全局设置</button>
                </fieldset>
              </form>
              <p id="risu-status" class="status" role="status"></p>
            </section>
            <div id="global-editor"></div>
            <p id="editor-error" class="status" role="status"></p>
            <button type="button" id="retry-editor" class="secondary" hidden>重新读取全局配置</button>
          </section>
          <section id="cards" aria-labelledby="page-heading" hidden>
            <p class="muted">描述、场景和配图资料按卡保存。模型、生图参数和自动配图开关沿用全局配置。</p>
            <div class="panel">
              <div class="toolbar">
                <label>角色卡<select id="risu-card"><option value="">选择角色卡</option></select></label>
                <button type="button" id="card-history" class="secondary" hidden>查看本卡生图历史</button>
              </div>
              <p id="card-status" class="status" role="status"></p>
              <form id="card-form" hidden>
                <fieldset>
                  <div class="grid">
                    <label class="wide">角色卡名称<input name="cardName" required maxlength="2048"></label>
                    <label>角色描述<textarea name="description" rows="5"></textarea></label>
                    <label>场景设定<textarea name="scenario" rows="5"></textarea></label>
                  </div>
                  <div id="card-library" class="prompt-list"></div>
                  <div class="actions">
                    <button>保存本卡资料</button>
                    <button type="button" id="card-reload" class="secondary">重新读取本卡</button>
                  </div>
                  <details id="card-advanced">
                    <summary>高级 · 角色卡与资料 JSON</summary>
                    <label for="card-json">完整角色卡与资料</label>
                    <textarea id="card-json" rows="14" spellcheck="false"></textarea>
                    <button type="button" id="card-apply-json" class="secondary">载入 JSON 到表单</button>
                  </details>
                </fieldset>
              </form>
            </div>
          </section>
          <section id="history" aria-labelledby="page-heading" hidden>
            <div class="panel">
              <div class="toolbar">
                <label>图片来源<select id="history-scope"><option value="">全部来源</option></select></label>
                <button type="button" id="history-refresh" class="secondary">刷新历史</button>
              </div>
              <p id="history-status" class="status" role="status"></p>
              <div id="history-list" class="gallery"></div>
              <button type="button" id="history-more" class="secondary" hidden>加载更多</button>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
